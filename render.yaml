# Render Blueprint: New > Blueprint > pick this repo. Free tier; secrets are set in the dashboard (sync: false).
services:
  - type: web
    name: mandate
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite,gemini-3.5-flash,gemini-flash-latest,gemini-3.8-flash
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: WEB_SEARCH_CACHE_MINUTES
        value: "180"
      - key: SEARCH_PROVIDERS
        value: tavily,serper,gemini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /tmp/mandate.db
      # Optional but recommended for a persistent demo (free Turso DB); otherwise state resets when the instance sleeps
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
